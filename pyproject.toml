[project]
name = "hitmos"
version = "0.0.1"
description = "AI terminal assistant powered by OpenRouter — minimal, fast, developer UX"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "White NEFOR", email = "n7for8572@gmail.com"},
]
maintainers = [
    {name = "White NEFOR", email = "n7for8572@gmail.com"},
]
keywords = [
    "ai",
    "cli",
    "assistant",
    "openrouter",
    "llm",
    "terminal",
    "chat",
    "deepseek",
    "developer-tools",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
    "Environment :: Console",
]
requires-python = ">=3.13"
dependencies = [
    "fasthttp-client>=1.3.13",
    "orjson>=3.9.0",
    "pydantic-settings>=2.0.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
hitmos = "hitmos.cli:app"

[project.urls]
Homepage = "https://github.com/ndugram/hitmos"
Documentation = "https://github.com/ndugram/hitmos"
Repository = "https://github.com/ndugram/hitmos"
Issues = "https://github.com/ndugram/hitmos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
